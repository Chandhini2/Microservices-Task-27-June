apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order

  template:

    metadata:
      labels:
        app: order

    spec:
      containers:

      - name: order-service
        image: yourdockerhub/order-service:latest

        ports:
        - containerPort: 3002

        env:
        - name: NODE_ENV
          value: "production"

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 3002

          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 5
          periodSeconds: 5