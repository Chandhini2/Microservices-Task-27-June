apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:

    metadata:
      labels:
        app: gateway

    spec:

      containers:

      - name: gateway

        image: yourdockerhub/gateway-service:latest

        ports:

        - containerPort: 3003

        env:

        - name: USER_SERVICE
          value: "http://user-service:3000"

        - name: PRODUCT_SERVICE
          value: "http://product-service:3001"

        - name: ORDER_SERVICE
          value: "http://order-service:3002"

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "300m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 3003

        readinessProbe:
          httpGet:
            path: /
            port: 3003